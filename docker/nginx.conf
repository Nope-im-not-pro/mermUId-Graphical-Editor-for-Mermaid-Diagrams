# mermUId nginx (T08): Static-Hosting des SvelteKit-Builds, Nicht-Root, Port 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Eigene Typ-Tabelle statt mime.types: .js/.mjs text/javascript (RFC 9239), .wasm application/wasm.
    types {
        text/html                    html htm;
        text/css                     css;
        text/javascript              js mjs;
        application/json             json map;
        application/manifest+json    webmanifest;
        application/wasm             wasm;
        application/xml              xml;
        text/plain                   txt mmd;
        image/svg+xml                svg svgz;
        image/png                    png;
        image/jpeg                   jpg jpeg;
        image/webp                   webp;
        image/x-icon                 ico;
        font/woff2                   woff2;
        font/woff                    woff;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/javascript application/json text/plain image/svg+xml;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # V-30: text/html komprimiert nginx immer; weitere Text-Typen hier.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/json application/manifest+json
               application/wasm application/xml text/plain image/svg+xml;

    # V-30: Cache-Control nach $uri (nach try_files/index, Fallback /index.html zählt als HTML).
    # Leerer Wert -> add_header sendet keinen Header.
    map $uri $cache_control {
        ~^/_app/immutable/  "public, max-age=31536000, immutable";
        ~*\.html$           "no-cache";
        default             "";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        absolute_redirect off;

        # Header nur auf server-Ebene: locations ohne eigenes add_header erben sie.
        # O-11: CSP = exakt content der Meta-CSP aus build/index.html (inkl. Hashes);
        # Platzhalter wird in Dockerfile Stage 1 ersetzt.
        add_header Content-Security-Policy "__META_CSP__" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control $cache_control;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
